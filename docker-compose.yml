services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: com-node-app
        ports:
            - '3000:3000'
        environment:
            - NODE_ENV=production
            - PORT=3000
            - MONGO_URI=mongodb://root:rootpassword@mongodb:27017/com-node-app?authSource=admin
            - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set}
            - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-1d}
            - REFRESH_TOKEN_SECRET=${REFRESH_TOKEN_SECRET:?REFRESH_TOKEN_SECRET must be set}
            - REFRESH_TOKEN_EXPIRES_IN=${REFRESH_TOKEN_EXPIRES_IN:-7d}
        depends_on:
            mongodb:
                condition: service_healthy
        networks:
            - com-node-app-network
        restart: unless-stopped

    mongodb:
        image: mongo:latest
        container_name: com-node-app-mongodb
        ports:
            - '27017:27017'
        volumes:
            - mongodb_data:/data/db
        environment:
            MONGO_INITDB_ROOT_USERNAME: root
            MONGO_INITDB_ROOT_PASSWORD: rootpassword
            MONGO_INITDB_DATABASE: com-node-app
        healthcheck:
            test: ['CMD', 'mongosh', '--eval', "db.adminCommand('ping')"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 10s
        networks:
            - com-node-app-network
        restart: unless-stopped

volumes:
    mongodb_data:

networks:
    com-node-app-network:
        driver: bridge
